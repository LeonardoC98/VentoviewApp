<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Testbild</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: 'Segoe UI', system-ui, sans-serif; }
  /* Rand: zeigt, ob das Fenster genau den Bildschirm füllt */
  .frame { position: fixed; inset: 0; border: 4px solid rgba(167, 139, 250, .85); border-radius: 0; pointer-events: none; }
  .card { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 28px 36px; border-radius: 24px;
    background: rgba(19, 19, 24, .78); color: #ececf1; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
  .card b { display: block; font-size: 30px; }
  .card span { color: #c4b5fd; font-size: 15px; }
  .clock { margin-top: 10px; font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ball { position: fixed; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c4b5fd, #7c4def 60%, #4c1d95);
    animation: move 9s linear infinite; }
  @keyframes move {
    0% { left: 5%; top: 10%; } 25% { left: 85%; top: 15%; } 50% { left: 80%; top: 75%; } 75% { left: 10%; top: 80%; } 100% { left: 5%; top: 10%; }
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="ball"></div>
  <div class="card">
    <b id="title"></b>
    <span id="sub"></span>
    <div class="clock" id="clock"></div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const MODES = { top: 'Über allem', above: 'Über dem Desktop', behind: 'Als Hintergrund' };
  document.getElementById('title').textContent = `Bildschirm ${q.get('nr')} · ${q.get('name')}`;
  document.getElementById('sub').textContent = `${q.get('w')} × ${q.get('h')} · ${MODES[q.get('mode')] || ''}`;
  const tick = () => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('de-DE'); };
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>

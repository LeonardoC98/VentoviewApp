<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Ventoview – Bildschirm-Test</title>
<style>
  body { margin: 0; padding: 24px; background: #0b0b0f; color: #ececf1; font: 14px/1.5 'Segoe UI', system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0 0 14px; color: #a1a1b0; }
  .url { display: flex; gap: 8px; margin: 18px 0; }
  .url input { flex: 1; height: 36px; padding: 0 12px; border: 1px solid #2a2a35; border-radius: 10px; background: #131318; color: inherit; font: inherit; }
  .screen { padding: 16px 18px; margin-bottom: 12px; border-radius: 16px; background: #131318; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }
  .screen h2 { margin: 0; font-size: 16px; }
  .screen small { color: #a1a1b0; }
  .tag { margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: #2a1d4a; color: #c4b5fd; font-size: 11px; font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  button { height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .07); color: inherit; font: 600 13px 'Segoe UI', sans-serif; cursor: pointer; }
  button:hover { background: rgba(255, 255, 255, .12); }
  button.on { background: #7c4def; color: #fff; }
  label { display: inline-flex; align-items: center; gap: 6px; color: #a1a1b0; }
  .status { margin-top: 10px; color: #a1a1b0; font-size: 13px; }
  .status.err { color: #f87171; }
  .info { padding: 10px 12px; border-radius: 10px; background: #131318; color: #a1a1b0; font-size: 12.5px; }
</style>
</head>
<body>
  <h1>Bildschirm-Test</h1>
  <p>Zeigt ein Overlay auf einem Bildschirm – zum Ausprobieren, welche Art auf deinem PC (auch mit Wallpaper Engine) funktioniert. Klicks gehen immer durch.</p>
  <div class="info" id="desktop">Desktop wird gelesen …</div>
  <div class="url">
    <input id="url" placeholder="Optional: Overlay-Link von ventoview.com einfügen – sonst kommt ein Testbild">
  </div>
  <div id="list"></div>
<script>
  const api = window.screensTest;
  const MODES = [['top', 'Über allem'], ['above', 'Über dem Desktop'], ['behind', 'Als Hintergrund'], ['off', 'Aus']];
  const state = {}; // id → { mode, status, error }

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') node.className = v; else if (k.startsWith('on')) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v);
    }
    node.append(...children.filter((c) => c != null));
    return node;
  }

  async function set(d, mode) {
    state[d.id] = { mode, status: 'Einen Moment …' };
    render(current);
    const result = mode === 'off' ? await api.hide(d.id) : await api.show(d.id, mode, document.getElementById('url').value.trim());
    state[d.id] = { mode: mode === 'off' ? null : mode, status: result, error: /^FEHLER/.test(result) };
    render(current);
  }

  let current = [];
  function render(list) {
    current = list;
    document.getElementById('list').replaceChildren(...list.map((d) => {
      const s = state[d.id] || {};
      return el('div', { class: 'screen' },
        el('h2', {}, `${d.nr} · ${d.label}`, d.primary ? el('span', { class: 'tag' }, 'Hauptbildschirm') : null),
        el('small', {}, `${d.width} × ${d.height} · Skalierung ${Math.round(d.scale * 100)} %${d.hz ? ` · ${Math.round(d.hz)} Hz` : ''} · Position ${d.x}, ${d.y}`),
        el('div', { class: 'row' }, ...MODES.map(([mode, label]) => el('button', {
          class: (s.mode || 'off') === mode ? 'on' : '', onclick: () => set(d, mode),
        }, label))),
        s.status ? el('div', { class: `status${s.error ? ' err' : ''}` }, s.status) : null);
    }));
  }

  api.displays().then(render);
  api.onDisplays(render);
  api.desktopInfo().then((text) => { document.getElementById('desktop').textContent = `Windows-Desktop: ${text}`; });
</script>
</body>
</html>
